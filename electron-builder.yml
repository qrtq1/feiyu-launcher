appId: com.feiyu.launcher
productName: 肥鱼启动器
copyright: MIT Licensed
directories:
  output: dist
  buildResources: build
# 用本地已经装好的 electron 二进制，避免打包时再下一遍 130MB
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
# 窗口/任务栏图标要从 resources 里读，打进安装包
extraResources:
  - from: build/icon.ico
    to: icon.ico
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
    # 单文件版：一个 exe 双击就能跑，不用安装
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: FeiyuLauncher-Setup-${version}.${ext}
portable:
  artifactName: FeiyuLauncher-${version}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 肥鱼启动器
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  icon: build/icon.png
  # 本地没有开发者证书：跳过签名，不然打包会卡在找 identity
  identity: null
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Game
  icon: build/icon.png
  synopsis: 从零写起的 Minecraft Java 版启动器
  # 可执行文件名用 ASCII，桌面上的显示名还是中文，免得某些系统的 locale 把文件名搞坏
  executableName: feiyu-launcher
  desktop:
    entry:
      Name: 肥鱼启动器
      Comment: Minecraft Java 版启动器
      Categories: Game;
